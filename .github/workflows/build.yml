name: Build ClipDeck
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: |
          $proj = (Get-ChildItem -Recurse -Filter ClipDeck.csproj | Select-Object -First 1).FullName
          dotnet publish $proj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/standalone
      - uses: actions/upload-artifact@v4
        with:
          name: ClipDeck-standalone
          path: out/standalone/ClipDeck.exe
